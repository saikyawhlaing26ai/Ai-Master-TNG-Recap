<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ai Master TNG Recap</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            shanYellow: '#FFDE00',
            shanGreen: '#009933',
            shanRed: '#CC0000',
          }
        }
      }
    }
  </script>
  <style>
    .flag-shadow { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
    /* Preview Effects */
    .video-mirror { transform: scaleX(-1); }
    .video-zoom-916 { object-fit: cover; aspect-ratio: 9/16; }
    .blur-band {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen transition-colors duration-200">

  <!-- Sidebar Overlay -->
  <div id="drawerOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 z-40 hidden backdrop-blur-sm transition-opacity"></div>

  <!-- Left Sidebar Drawer -->
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-white dark:bg-zinc-900 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col justify-between p-5 border-r border-zinc-200 dark:border-zinc-800">
    <div class="space-y-6">
      <div class="flex items-center justify-between border-b border-zinc-200 dark:border-zinc-800 pb-3">
        <h2 id="menuTitle" class="text-lg font-bold tracking-tight">သတ်မှတ်ချက်များ (Menu)</h2>
        <button onclick="toggleMenu()" class="p-1 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Theme Switcher -->
      <div class="space-y-2">
        <label id="lblTheme" class="text-xs uppercase font-bold text-zinc-500 tracking-wider">အလင်း / အမှောင် မုဒ်</label>
        <button onclick="toggleTheme()" class="w-full flex items-center justify-between p-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 hover:bg-zinc-100">
          <span id="themeStateText" class="text-sm font-medium">Dark Mode ပြောင်းမည်</span>
          <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Language Selector -->
      <div class="space-y-2">
        <label id="lblLang" class="text-xs uppercase font-bold text-zinc-500 tracking-wider">UI ဘာသာစကား</label>
        <select id="langSelect" onchange="changeLanguage(this.value)" class="w-full p-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-sm font-medium focus:ring-2 focus:ring-yellow-400 outline-none">
          <option value="mm">မြန်မာစာ (Myanmar)</option>
          <option value="shn">လိၵ်ႈတႆး (Shan)</option>
          <option value="th">ไทย (Thai)</option>
          <option value="en">English</option>
        </select>
      </div>

      <!-- History -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label id="lblHistory" class="text-xs uppercase font-bold text-zinc-500 tracking-wider">လုပ်ဆောင်မှုမှတ်တမ်း</label>
          <span id="historyCount" class="text-xs text-zinc-400">0 Items</span>
        </div>
        <div id="historyList" class="p-3 rounded-xl border border-dashed border-zinc-300 dark:border-zinc-800 text-center text-xs text-zinc-400">
          မှတ်တမ်း အသစ်မရှိသေးပါ
        </div>
      </div>
    </div>

    <!-- Google AI Studio Key Entry -->
    <div class="border-t border-zinc-200 dark:border-zinc-800 pt-3">
      <label class="text-xs font-semibold text-zinc-500 block mb-1">Google AI Studio API Key</label>
      <input id="geminiApiKey" type="password" placeholder="AIzaSy..." class="w-full text-xs p-2 rounded-lg bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 outline-none">
    </div>
  </aside>

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border-b border-zinc-200 dark:border-zinc-800 px-4 py-3 flex items-center justify-between">
    <button onclick="toggleMenu()" class="p-2 rounded-xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition">
      <i data-lucide="menu" class="w-5 h-5 text-zinc-800 dark:text-zinc-200"></i>
    </button>

    <!-- Center App Branding with Shan Flags -->
    <div class="flex items-center space-x-2">
      <svg class="w-6 h-4 rounded-sm flag-shadow overflow-hidden" viewBox="0 0 900 600">
        <rect width="900" height="200" fill="#FFDE00"/>
        <rect y="200" width="900" height="200" fill="#009933"/>
        <rect y="400" width="900" height="200" fill="#CC0000"/>
        <circle cx="450" cy="300" r="130" fill="#FFFFFF"/>
      </svg>
      <h1 class="text-base sm:text-lg font-black tracking-tight bg-gradient-to-r from-amber-500 via-emerald-500 to-rose-500 bg-clip-text text-transparent">
        Ai Master TNG Recap
      </h1>
      <svg class="w-6 h-4 rounded-sm flag-shadow overflow-hidden" viewBox="0 0 900 600">
        <rect width="900" height="200" fill="#FFDE00"/>
        <rect y="200" width="900" height="200" fill="#009933"/>
        <rect y="400" width="900" height="200" fill="#CC0000"/>
        <circle cx="450" cy="300" r="130" fill="#FFFFFF"/>
      </svg>
    </div>

    <div class="w-9 h-9 flex items-center justify-center rounded-xl bg-amber-500/10 text-amber-500 font-bold text-xs">
      v1.1
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-xl mx-auto p-4 space-y-4 pb-20">
    
    <!-- Step 1: Input Stage -->
    <section class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-4 shadow-sm space-y-3">
      <div class="flex items-center space-x-2 text-sm font-bold">
        <span class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs">1</span>
        <span id="txtStep1Title">ဗီဒီယို လင့်ခ် သို့မဟုတ် ဖိုင်ထည့်ပါ</span>
      </div>

      <div class="space-y-2">
        <input id="inputVideoUrl" type="url" placeholder="TikTok / YouTube / FB Reel Link ကူးထည့်ပါ" class="w-full text-sm p-3 rounded-xl bg-zinc-50 dark:bg-zinc-800/60 border border-zinc-200 dark:border-zinc-700 outline-none focus:border-emerald-500">
        <div class="text-center text-xs text-zinc-400 font-semibold">— (သို့မဟုတ်) —</div>
        
        <!-- Video Upload Box -->
        <label id="uploadArea" class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-300 dark:border-zinc-700 rounded-xl p-4 cursor-pointer hover:bg-zinc-50 dark:hover:bg-zinc-800/40 transition">
          <i data-lucide="upload-cloud" class="w-7 h-7 text-emerald-500 mb-1"></i>
          <span id="fileNameLabel" class="text-xs font-medium text-zinc-600 dark:text-zinc-300">ဖုန်းထဲမှ Video File ရွေးပါ</span>
          <span class="text-[10px] text-zinc-400 mt-0.5">MP4, WebM, MOV လက်ခံပါသည်</span>
          <input type="file" id="videoFileInput" accept="video/*" class="hidden" onchange="handleFileSelect(event)">
        </label>
      </div>

      <!-- Video Preview Player (Hidden until uploaded) -->
      <div id="previewContainer" class="hidden relative mt-3 rounded-xl overflow-hidden border border-zinc-200 dark:border-zinc-800 bg-black aspect-[9/16] max-h-[380px] mx-auto flex items-center justify-center">
        <video id="videoPlayer" playsinline controls class="w-full h-full object-contain"></video>
        
        <!-- Blur Band Overlay -->
        <div id="blurOverlay" class="absolute bottom-12 inset-x-0 h-10 blur-band pointer-events-none border-y border-white/10 hidden"></div>

        <!-- Sample Live Subtitle -->
        <div id="captionOverlay" class="absolute bottom-4 inset-x-2 text-center text-yellow-300 font-bold text-xs pointer-events-none drop-shadow-[0_2px_2px_rgba(0,0,0,0.9)] hidden">
          မြန်မာစာတန်းထိုး (Live Subtitle Preview)
        </div>
      </div>
    </section>

    <!-- Step 2: Settings & Tools -->
    <section class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-4 shadow-sm space-y-3">
      <div class="flex items-center space-x-2 text-sm font-bold">
        <span class="w-6 h-6 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs">2</span>
        <span id="txtStep2Title">Recap & Copyright Settings</span>
      </div>

      <div class="grid grid-cols-2 gap-2 text-xs">
        <label class="flex items-center p-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 space-x-2 cursor-pointer bg-zinc-50 dark:bg-zinc-800/40">
          <input type="checkbox" id="chkMirror" onchange="applyVideoFilters()" class="rounded text-emerald-500">
          <span>Mirror Flip (ဘယ်/ညာ)</span>
        </label>
        <label class="flex items-center p-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 space-x-2 cursor-pointer bg-zinc-50 dark:bg-zinc-800/40">
          <input type="checkbox" id="chkZoom" onchange="applyVideoFilters()" class="rounded text-emerald-500">
          <span>Zoom & 9:16 Crop</span>
        </label>
        <label class="flex items-center p-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 space-x-2 cursor-pointer bg-zinc-50 dark:bg-zinc-800/40">
          <input type="checkbox" id="chkBlur" onchange="applyVideoFilters()" class="rounded text-emerald-500">
          <span>Subtitle Blur Band</span>
        </label>
        <label class="flex items-center p-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 space-x-2 cursor-pointer bg-zinc-50 dark:bg-zinc-800/40">
          <input type="checkbox" id="chkCaption" onchange="applyVideoFilters()" checked class="rounded text-emerald-500">
          <span>Burmese Captions</span>
        </label>
      </div>
    </section>

    <!-- Step 3: Google AI Studio Recap Generation -->
    <section class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-4 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2 text-sm font-bold">
          <span class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs">3</span>
          <span id="txtStep3Title">AI Movie Recap စာသားဖန်တီးမှု</span>
        </div>
        <button onclick="generateRecapScript()" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-rose-500 text-white text-xs font-bold shadow hover:opacity-95 flex items-center space-x-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>Generate</span>
        </button>
      </div>

      <textarea id="recapOutput" rows="4" placeholder="Gemini က Recap Script နှင့် စာတန်းထိုးများကို အလိုအလျောက် ရေးသားပေးပါမည်..." class="w-full text-xs p-3 rounded-xl bg-zinc-50 dark:bg-zinc-800/60 border border-zinc-200 dark:border-zinc-700 outline-none leading-relaxed"></textarea>
    </section>

    <!-- Action Button -->
    <button onclick="alert('ဗီဒီယိုအား Render စနစ်ဖြင့် လုပ်ဆောင်ရန် အဆင်သင့်ဖြစ်ပါပြီ။')" class="w-full py-3.5 rounded-2xl bg-zinc-900 dark:bg-white text-white dark:text-zinc-950 font-bold text-sm shadow-lg flex items-center justify-center space-x-2 active:scale-95 transition">
      <i data-lucide="play-circle" class="w-5 h-5"></i>
      <span>Render Video & Post Kit</span>
    </button>
  </main>

  <script>
    lucide.createIcons();

    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('drawerOverlay');
      const isClosed = sidebar.classList.contains('-translate-x-full');
      if (isClosed) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      document.getElementById('themeStateText').innerText = isDark ? "Light Mode ပြောင်းမည်" : "Dark Mode ပြောင်းမည်";
      document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
    }

    const translations = {
      mm: {
        menuTitle: "သတ်မှတ်ချက်များ (Menu)",
        lblTheme: "အလင်း / အမှောင် မုဒ်",
        lblLang: "UI ဘာသာစကား",
        lblHistory: "လုပ်ဆောင်မှုမှတ်တမ်း",
        step1: "ဗီဒီယို လင့်ခ် သို့မဟုတ် ဖိုင်ထည့်ပါ",
        step2: "Recap & Copyright Settings",
        step3: "AI Movie Recap စာသားဖန်တီးမှု"
      },
      shn: {
        menuTitle: "ၵၢၼ်မၵ်းမၼ်ႈ (Menu)",
        lblTheme: "ပိူင်း / လပ်း မူတ်ႉ",
        lblLang: "လိၵ်ႈလၢႆး UI",
        lblHistory: "သိုၵ်းပိုၼ်းႁဵတ်းသၢင်ႈ",
        step1: "သႂ်ႇ လိင်ႉဝီႇတီႇဢူဝ်ႇ (ဢမ်ႇၼၼ်) ၾၢႆႇ",
        step2: "ၵၢၼ်မၵ်းမၼ်ႈ Recap & Copyright",
        step3: "AI ၵေႃႇသၢင်ႈလိၵ်ႈ Recap ၸၢတ်ႈငဝ်း"
      },
      th: {
        menuTitle: "เมนูการตั้งค่า (Menu)",
        lblTheme: "โหมดมืด / สว่าง",
        lblLang: "ภาษา UI",
        lblHistory: "ประวัติการทำงาน",
        step1: "ใส่ลิงก์หรืออัปโหลดวิดีโอ",
        step2: "ตั้งค่า Recap & ลิขสิทธิ์",
        step3: "สร้างสคริปต์ AI Movie Recap"
      },
      en: {
        menuTitle: "Menu Settings",
        lblTheme: "Light / Dark Mode",
        lblLang: "UI Language",
        lblHistory: "Activity History",
        step1: "Insert Video Link or File",
        step2: "Recap & Copyright Settings",
        step3: "AI Movie Recap Scripting"
      }
    };

    function changeLanguage(lang) {
      const t = translations[lang] || translations.en;
      document.getElementById('menuTitle').innerText = t.menuTitle;
      document.getElementById('lblTheme').innerText = t.lblTheme;
      document.getElementById('lblLang').innerText = t.lblLang;
      document.getElementById('lblHistory').innerText = t.lblHistory;
      document.getElementById('txtStep1Title').innerText = t.step1;
      document.getElementById('txtStep2Title').innerText = t.step2;
      document.getElementById('txtStep3Title').innerText = t.step3;
    }

    // Video Selection and Preview Handler
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('fileNameLabel').innerText = "တင်ပြီး: " + file.name;
        
        const videoPlayer = document.getElementById('videoPlayer');
        const previewContainer = document.getElementById('previewContainer');
        
        const videoUrl = URL.createObjectURL(file);
        videoPlayer.src = videoUrl;
        previewContainer.classList.remove('hidden');
        videoPlayer.load();

        applyVideoFilters();
      }
    }

    // Apply Live Filters (Mirror, Crop, Blur Band, Captions)
    function applyVideoFilters() {
      const videoPlayer = document.getElementById('videoPlayer');
      const isMirror = document.getElementById('chkMirror').checked;
      const isZoom = document.getElementById('chkZoom').checked;
      const isBlur = document.getElementById('chkBlur').checked;
      const isCaption = document.getElementById('chkCaption').checked;

      // Mirror
      if (isMirror) {
        videoPlayer.classList.add('video-mirror');
      } else {
        videoPlayer.classList.remove('video-mirror');
      }

      // Zoom & 9:16 Crop
      if (isZoom) {
        videoPlayer.classList.add('video-zoom-916');
      } else {
        videoPlayer.classList.remove('video-zoom-916');
      }

      // Blur Band
      const blurOverlay = document.getElementById('blurOverlay');
      if (isBlur) {
        blurOverlay.classList.remove('hidden');
      } else {
        blurOverlay.classList.add('hidden');
      }

      // Caption Overlay
      const captionOverlay = document.getElementById('captionOverlay');
      if (isCaption) {
        captionOverlay.classList.remove('hidden');
      } else {
        captionOverlay.classList.add('hidden');
      }
    }

    // Google AI Studio (Gemini 1.5 Flash) API Call
    async function generateRecapScript() {
      const apiKey = document.getElementById('geminiApiKey').value;
      const output = document.getElementById('recapOutput');
      
      if (!apiKey) {
        alert("Sidebar Menu ထဲတွင် Google AI Studio API Key ကို ဦးစွာထည့်သွင်းပေးပါခင်ဗျာ။");
        toggleMenu();
        return;
      }

      output.value = "ခေတ္တစောင့်ဆိုင်းပါ... Gemini က စာသားများကို သုံးသပ်ပြီး Recap စတိုင် မြန်မာ script ရေးစပ်နေပါသည်...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: "You are an expert viral movie recap writer for Myanmar audiences. Write an engaging 1-minute recap script in Burmese with catchy voiceover tone and hooks, ready for TikTok and Reels."
              }]
            }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          output.value = data.candidates[0].content.parts[0].text;
        } else {
          output.value = "စာသားထုတ်ယူရာတွင် အမှားအယွင်းဖြစ်ပေါ်ခဲ့ပါသည်- " + JSON.stringify(data);
        }
      } catch (err) {
        output.value = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
